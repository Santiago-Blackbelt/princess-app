<!DOCTYPE html>
<html>
  <head>
    <!-- Required meta tags-->
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- Color theme for statusbar (Android only) -->
    <meta name="theme-color" content="#2196f3" />
    <!-- Your app title -->
    <title>Detalhes</title>
    <!-- Path to Framework7 Library Bundle CSS -->
    <link rel="stylesheet" href="lib/framework7-bundle.min.css" />
    <!-- CSS PERSONALIZADO PARA MENU-->
    <link rel="stylesheet" href="/www/css/index.css" />
    <!--Ícones Material Design-->
    <link rel="stylesheet" href="css/materialdesignicons.min.css" />
    <!-- Remixicon -->
    <link rel="stylesheet" href="css/remixicon/remixiconcss.css" />
  </head>

  <body>
    <!-- App root element -->
    <div id="app">
      <!-- Your main view, should have "view-main" class -->
      <div class="view view-main">
        <!-- Initial Page, "data-name" contains page name -->
        <div data-name="detalhes" class="page color-theme-blue">
          <!-- TAB BAR-->
          <div class="toolbar toolbar-bottom">
            <div class="toolbar-innner">
              <span class="riscado">R$:200,00</span>
              <div>R$:150,00</div>
            </div>
          </div>

          <!-- Scrollable page content -->
          <div class="page-content">
            <div class="prod-detail">
              <div class="buttons-top">
                <a href="/index/"><i class="ri-arrow-left-circle-line"></i></a>
                <a href="#"><i class="ri-share-2-line"></i></a>
              </div>
              <img src="img/imgdefault.png" class="imgdefault" />
            </div>
            <div class="prod-content">
              <div class="block">
                <div class="line">
                  <b>Nome do produto</b>
                  <button class="promo-btn">Promoção</button>
                </div>
                <div class="description">
                  <p>
                    Lorem ipsum dolor, sit amet consectetur adipisicing elit.
                    Unde cumque, sunt possimus culpa nobis eaque deserunt
                    tempora laudantium iusto ut atque nihil itaque dolor commodi
                    corporis et reprehenderit consequuntur earum.
                  </p>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <!-- Path to Framework7 Library Bundle JS-->
    <script type="text/javascript" src="lib/framework7-bundle.min.js"></script>
    <!-- jQuery -->
    <script type="text/javascript" src="lib/jquery-3.7.0.min.js"></script>
    <!-- Roteamento do app-->
    <script type="text/javascript" src="js/routes.js"></script>
    <script src="cordova.js"></script>
  </body>
</html>
